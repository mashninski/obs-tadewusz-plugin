<!doctype html>
<html lang="be">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadewusz — інтро і аўтра</title>
    <link rel="stylesheet" href="/src/intro/intro.css" />
  </head>
  <body>
    <div id="root">
    <div id="frame">
      <canvas id="topo" width="1920" height="1080" aria-hidden="true"></canvas>
      <div id="grain" aria-hidden="true"></div>
      <main id="stage">
        <section class="links">
          <h1 id="linksTitle"></h1>
          <ul id="links"></ul>
        </section>
        <section class="side">
          <div class="clip">
            <div class="clip-glow" aria-hidden="true"></div>
            <div id="screen" class="clip-screen">
              <div id="idle" class="clip-idle"><span id="idleText"></span></div>
            </div>
            <!-- Аўтра: картка рэйду на месцы кліпа (кліпы на гэты час спыняюцца). -->
            <div id="raidCard" class="raid-card" hidden>
              <div class="raid-shot"><img id="raidShot" alt="" /></div>
              <div class="raid-shade" aria-hidden="true"></div>
              <div class="raid-top">
                <span class="raid-kicker">Рэйд</span>
                <span class="raid-live"><span class="raid-live-dot" aria-hidden="true"></span><span id="raidViewers"></span></span>
              </div>
              <div class="raid-body">
                <img id="raidAvatar" class="raid-avatar" alt="" />
                <div class="raid-text">
                  <div class="raid-name"><span id="raidName"></span><span id="raidMature" class="raid-mature" hidden>18+</span></div>
                  <div id="raidGame" class="raid-game"></div>
                  <div id="raidTitle" class="raid-title"></div>
                </div>
              </div>
            </div>
            <div id="caption" class="clip-caption hidden">
              <span id="clipTitle" class="clip-title"></span>
              <span id="clipBy" class="clip-by"><span class="clip-dot" aria-hidden="true">·</span><span id="clipAuthor"></span></span>
            </div>
          </div>
          <div id="countdown" class="countdown">
            <div id="countdownLabel" class="countdown-label">Да пачатку стрыму</div>
            <div id="countdownTime" class="countdown-time">10:00</div>
            <div id="finish" class="finish" hidden></div>
            <div id="outroText" class="finish" hidden></div>
            <div id="raidInfo" class="raid-info" hidden>
              <div class="raid-heading">Рэйдзім <span id="raidHeadingName"></span></div>
              <div id="raidTime" class="countdown-time raid-time">10</div>
              <div class="raid-bar" aria-hidden="true"><div id="raidBar" class="raid-bar-fill"></div></div>
            </div>
          </div>
        </section>
      </main>
      <footer id="donations" class="donations" hidden>
        <span class="donations-title">Падтрымка канала</span>
        <span class="donations-line">Хутка тут з’явяцца данаты</span>
      </footer>
    </div>
    <!-- Плэеры, картка і прэв’ю — паверх кадра; пад ім (y ≥ 1086) — месца «за кадрам». -->
    <div id="players"></div>
    </div>
    <script type="module" src="/src/intro/intro.js"></script>
  </body>
</html>
